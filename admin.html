<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - NURA</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"><script src="config.js"></script><style>body{font-family:Inter,sans-serif;background:#FFF7F9}h1,h2,.black{font-family:'Archivo Black',sans-serif}.marquee{animation:m 16s linear infinite}@keyframes m{from{transform:translateX(0)}to{transform:translateX(-50%)}}.card{transition:.3s}.card:hover{transform:translateY(-3px)}.swatch{width:36px;height:36px;border-radius:9999px;border:2px solid white;box-shadow:0 0 0 1.5px #ddd;cursor:pointer}.swatch.active{box-shadow:0 0 0 2.5px #FF2E88}</style></head><body><header class="flex justify-between px-4 py-3 bg-white border-b"><b class="black text-xl">NURA - Admin</b><a href="index.html">← Site</a></header><main class="max-w-6xl mx-auto px-4 py-5"><h1 class="black text-2xl">Commandes</h1><button onclick="exportCSV()" class="bg-black text-white px-4 py-2 rounded-full font-bold mt-3">Exporter CSV</button><div id="list" class="mt-4 space-y-2"></div></main><script>const a=getOrders();document.getElementById('list').innerHTML=a.length?a.map(o=>`<div class="bg-white border p-4 rounded-2xl flex justify-between"><div><b>${o.model} - ${o.color}</b><p class="text-sm">${o.nom} • ${o.tel} • ${o.ville}</p></div><b>${o.price} DH x ${o.qty}</b></div>`).join(''):'<p>Aucune commande.</p>';function exportCSV(){let c='Date,Model,Couleur,Qty,Prix,Nom,Tel,Ville\n';a.forEach(o=>c+=`${o.date},${o.model},${o.color},${o.qty},${o.price},${o.nom},${o.tel},${o.ville}\n`);const b=new Blob([c]);const u=URL.createObjectURL(b);const al=document.createElement('a');al.href=u;al.download='nura-orders.csv';al.click();}</script></body></html>
